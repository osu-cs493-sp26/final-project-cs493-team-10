name: tarpaulin

services:
  postgres:
    image: postgres
    env_file: src/.env.production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 5s
  
  initdb:
    build: ./src # also uses the main Dockerfile in the src directory
    env_file: src/.env.production
    command: [ "npm", "run", "initdb" ]
    depends_on:
      postgres:
        condition: service_healthy
        restart: true # restart the initdb service if postgres fails.
  
  redis:
    image: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 3s

  plagiarism-worker:
    build:
      context: ./src
      dockerfile: workers/plagiarism-worker/dockerfile.plagiarism-worker
    env_file: src/.env.production
    depends_on:
      initdb:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
        restart: true # restart the plagiarism-worker service if redis fails.
  
  api:
    build: ./src
    env_file: src/.env.production
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true # restart the api service if postgres fails.
      initdb:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
        restart: true # restart the api service if redis fails.