services:
  postgres:
    image: postgres
    env_file: .env.production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 5s
  
  api:
    build: .
    env_file: .env.production
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true